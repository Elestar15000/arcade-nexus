</head>
<body>
    <noscript><p style="padding:2rem;color:#fff">Nexus Arcade necesita JavaScript para funcionar.</p></noscript>

    <canvas id="bg-particles" aria-hidden="true"></canvas>

    <div id="app">
        <!-- Acceso: iniciar sesión / crear cuenta -->
        <div id="auth-screen" class="auth-screen" hidden></div>

        <!-- Aplicación -->
        <div id="shell" class="shell" hidden>
            <aside id="sidebar" class="sidebar" aria-label="Navegación principal">
                <div class="sidebar-header">
                    <a class="brand" href="#/home" aria-label="Nexus Arcade, ir al inicio">
                        <svg class="logo-diamond nx-logo" width="40" height="40" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
                            <defs><linearGradient id="nxs-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE680"/><stop offset=".5" stop-color="#FFD43B"/><stop offset="1" stop-color="#F2A900"/></linearGradient></defs>
                            <g transform="rotate(45 50 50)"><rect x="17" y="17" width="66" height="66" rx="15" fill="url(#nxs-g)"/><rect x="37" y="37" width="26" height="26" rx="6" fill="#141640"/></g></svg>
                        <span class="brand-text"><span class="logo-title">Nexus</span><span class="logo-sub">Arcade</span></span>
                    </a>
                    <button id="sidebar-collapse" class="icon-btn sidebar-collapse-btn" type="button"
                            aria-controls="sidebar" aria-expanded="true" aria-label="Plegar barra lateral"
                            title="Plegar / desplegar (Ctrl + B)">
                        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                </div>

                <nav class="sidebar-nav" id="sidebar-nav"></nav>

                <div class="sidebar-footer">
                    <a id="user-card" class="user-card" href="#/profile">
                        <span class="avatar avatar-md" aria-hidden="true"><span class="avatar-slot" id="user-avatar"></span><span class="sync-dot" id="sync-dot" data-state="idle"></span></span>
                        <span class="user-info">
                            <span class="user-name" id="user-name">Jugador</span>
                            <span class="user-title" id="user-title" hidden></span>
                            <span class="user-rank" id="user-rank">Nivel 1</span>
                            <span class="user-xp">
                                <span class="bar"><span class="bar-fill" id="user-xp-fill"></span></span>
                                <span class="user-xp-text" id="user-xp-text">0 / 100 XP</span>
                            </span>
                        </span>
                    </a>
                    <button id="btn-switch-user" class="icon-btn switch-user" type="button" title="Cerrar sesión" aria-label="Cerrar sesión">
                        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 4H5a1 1 0 00-1 1v14a1 1 0 001 1h4M16 8l4 4-4 4M20 12H9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        <span class="switch-user-label">Cerrar sesión</span>
                    </button>
                </div>
            </aside>

            <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

            <div class="main-wrap">
                <header class="topbar">
                    <button id="sidebar-toggle" class="icon-btn" type="button" aria-controls="sidebar" aria-expanded="true"
                            aria-label="Plegar barra lateral" title="Menú (Ctrl + B)">
                        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
                    </button>
                    <div class="topbar-title">
                        <span class="topbar-crumb" id="page-crumb">Launcher</span>
                        <h1 id="page-title" class="page-heading">Inicio</h1>
                    </div>
                    <label class="topbar-search" id="topbar-search">
                        <svg class="nx-ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
                        <input type="search" id="topbar-search-input" placeholder="Buscar juegos…" aria-label="Buscar juegos" autocomplete="off" />
                        <kbd aria-hidden="true">/</kbd>
                    </label>
                    <div class="topbar-right">
                        <button id="topbar-daily" class="topbar-btn" type="button" aria-haspopup="dialog" aria-expanded="false" title="Retos de hoy">
                            <span aria-hidden="true"><svg class="nx-ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/><rect x="7" y="13" width="3.5" height="3.5" rx=".8" fill="currentColor" stroke="none"/></svg></span><span class="topbar-btn-label">Retos</span><span class="topbar-badge" id="topbar-daily-badge" hidden></span>
                        </button>
                        <a class="topbar-rombos" href="#/cosmetics" id="topbar-rombos" title="Rombos: pase de batalla, tienda y colección"><svg viewBox="0 0 100 100" width="18" height="18" aria-hidden="true"><g transform="rotate(45 50 50)"><rect x="17" y="17" width="66" height="66" rx="15" fill="#FFD43B"/><rect x="37" y="37" width="26" height="26" rx="6" fill="#141640"/></g></svg><b id="topbar-rombos-n">0</b><span class="sr-only">Rombos</span></a>
                        <a class="topbar-level" href="#/profile" title="Ver perfil" id="topbar-ring">
                            <span class="tl-star" aria-hidden="true"><svg class="nx-ic" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="m12 2.8 2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3-4.6-4.4 6.3-.9z"/></svg></span>
                            <span class="tl-txt"><b id="topbar-level" class="chip">Nivel 1</b><span class="tl-bar"><i id="topbar-xp"></i></span></span>
                        </a>
                        <span class="topbar-sep" aria-hidden="true"></span>
                        <div class="tb-user">
                            <button type="button" class="tb-user-btn" id="topbar-user-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="topbar-menu" title="Tu cuenta">
                                <span class="avatar avatar-sm" aria-hidden="true"><span class="avatar-slot" id="topbar-avatar"></span></span>
                                <svg class="nx-ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
                                <span class="sr-only">Menú de la cuenta</span>
                            </button>
                            <div class="tb-menu" id="topbar-menu" role="menu" hidden></div>
                        </div>
                    </div>
                    <div class="topbar-pop" id="topbar-pop" hidden></div>
                </header>
                <main id="view" class="view-container" tabindex="-1"></main>
            </div>
        </div>
    </div>
