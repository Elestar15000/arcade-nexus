<html lang="es" data-theme="neon">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0e1f">
    <meta name="description" content="Nexus Arcade: colección de minijuegos con perfiles locales, logros y rankings.">
    <title>Nexus Arcade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Manrope:wght@400..800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/pages.css">
    <link rel="stylesheet" href="assets/css/admin.css">
    <link rel="stylesheet" href="assets/css/library.css">
    <link rel="stylesheet" href="assets/css/games/minesweeper.css">
    <link rel="stylesheet" href="assets/css/games/wordle.css">
    <link rel="stylesheet" href="assets/css/games/pasapalabra.css">
    <link rel="stylesheet" href="assets/css/games/arcade.css">
    <link rel="stylesheet" href="assets/css/games/tetris.css">
    <link rel="stylesheet" href="assets/css/games/pacman.css">
    <link rel="stylesheet" href="assets/css/games/snake.css">
    <link rel="stylesheet" href="assets/css/games/pong.css">
    <link rel="stylesheet" href="assets/css/games/online.css">
    <link rel="stylesheet" href="assets/css/games/chess.css">
    <link rel="stylesheet" href="assets/css/games/battleship.css">
    <link rel="stylesheet" href="assets/css/games/cards.css">
    <link rel="stylesheet" href="assets/css/games/escape.css">
    <link rel="stylesheet" href="assets/css/games/puzzles.css">
    <link rel="stylesheet" href="assets/css/games/solitaire.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕹️</text></svg>">
</head>
<body>
    <noscript><p style="padding:2rem;color:#fff">Nexus Arcade necesita JavaScript para funcionar.</p></noscript>

    <canvas id="bg-particles" aria-hidden="true"></canvas>

    <div id="app">
        <!-- Acceso: iniciar sesión / crear cuenta -->
        <div id="auth-screen" class="auth-screen" hidden></div>

        <!-- Aplicación -->
        <div id="shell" class="shell" hidden>
            <aside id="sidebar" class="sidebar" aria-label="Navegación principal">
                <div class="sidebar-header">
                    <a class="brand" href="#/home" aria-label="Nexus Arcade, ir al inicio">
                        <span class="logo-diamond">◆</span>
                        <span class="brand-text"><span class="logo-title">Nexus</span><span class="logo-sub">Arcade</span></span>
                    </a>
                    <button id="sidebar-collapse" class="icon-btn sidebar-collapse-btn" type="button"
                            aria-controls="sidebar" aria-expanded="true" aria-label="Plegar barra lateral"
                            title="Plegar / desplegar (Ctrl + B)">
                        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                </div>

                <nav class="sidebar-nav" id="sidebar-nav"></nav>

                <div class="sidebar-footer">
                    <a id="user-card" class="user-card" href="#/profile">
                        <span class="avatar avatar-md" aria-hidden="true"><span id="user-avatar">🎮</span><span class="sync-dot" id="sync-dot" data-state="idle"></span></span>
                        <span class="user-info">
                            <span class="user-name" id="user-name">Jugador</span>
                            <span class="user-rank" id="user-rank">Nivel 1</span>
                            <span class="user-xp">
                                <span class="bar"><span class="bar-fill" id="user-xp-fill"></span></span>
                                <span class="user-xp-text" id="user-xp-text">0 / 100 XP</span>
                            </span>
                        </span>
                    </a>
                    <button id="btn-switch-user" class="icon-btn switch-user" type="button" title="Cerrar sesión" aria-label="Cerrar sesión">
                        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 4H5a1 1 0 00-1 1v14a1 1 0 001 1h4M16 8l4 4-4 4M20 12H9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        <span class="switch-user-label">Cerrar sesión</span>
                    </button>
                </div>
            </aside>

            <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

            <div class="main-wrap">
                <header class="topbar">
                    <button id="sidebar-toggle" class="icon-btn" type="button" aria-controls="sidebar" aria-expanded="true"
                            aria-label="Plegar barra lateral" title="Menú (Ctrl + B)">
                        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
                    </button>
                    <div class="topbar-title">
                        <span class="topbar-crumb" id="page-crumb">Launcher</span>
                        <h1 id="page-title" class="page-heading">Inicio</h1>
                    </div>
                    <label class="topbar-search" id="topbar-search">
                        <span aria-hidden="true">🔎</span>
                        <input type="search" id="topbar-search-input" placeholder="Buscar juego…" aria-label="Buscar juego" autocomplete="off" />
                        <kbd aria-hidden="true">/</kbd>
                    </label>
                    <div class="topbar-right">
                        <button id="topbar-daily" class="topbar-btn" type="button" aria-haspopup="dialog" aria-expanded="false" title="Retos de hoy">
                            <span aria-hidden="true">📅</span><span class="topbar-btn-label">Retos</span><span class="topbar-badge" id="topbar-daily-badge" hidden></span>
                        </button>
                        <a class="topbar-level" href="#/profile" title="Ver perfil">
                            <span class="topbar-ring" id="topbar-ring"><span id="topbar-level" class="chip">Nv. 1</span></span>
                            <span class="avatar avatar-sm" aria-hidden="true"><span id="topbar-avatar">🎮</span></span>
                        </a>
                    </div>
                    <div class="topbar-pop" id="topbar-pop" hidden></div>
                </header>
                <main id="view" class="view-container" tabindex="-1"></main>
            </div>
        </div>
    </div>

    <!-- Configuración del sitio (URL del servidor) -->
    <script src="config.js"></script>

    <!-- Núcleo -->

    <script src="src/ui/game-settings.js"></script>
    <script src="src/ui/launcher.js"></script>

    <script src="src/ui/auth.js"></script>
    <script src="src/ui/qr.js"></script>
    <script src="src/ui/admin.js"></script>
    <script src="src/ui/pages/home.js"></script>
    <script src="src/ui/pages/library.js"></script>
    <script src="src/ui/pages/info.js"></script>
    <script src="src/ui/pages/achievements.js"></script>
    <script src="src/ui/pages/rankings.js"></script>
    <script src="src/ui/pages/stats.js"></script>
    <script src="src/ui/pages/profile.js"></script>
    <script src="src/ui/pages/settings.js"></script>

    <!-- Juegos -->
    <script src="assets/data/words-es.js"></script>
    <script src="src/games/registry.js"></script>
    <script src="src/games/collections.js"></script>

    <script src="src/games/cardgames/table.js"></script>

    <script src="src/games/escape/daily.js"></script>
    <script src="src/games/escape/game.js"></script>
    <script src="src/games/shared/puzzle.js"></script>

    <script src="src/games/connections/bank.js"></script>

    <script src="src/games/g2048/game.js"></script>
    <script src="src/games/solitaire/game.js"></script>

    <script src="src/app.js"></script>
</body>
</html>
