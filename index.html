<!DOCTYPE html>
<html lang="es" data-theme="neon">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#06060f">
    <meta name="description" content="Nexus Arcade: colección de minijuegos con perfiles locales, logros y rankings.">
    <title>Nexus Arcade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/pages.css">
    <link rel="stylesheet" href="assets/css/games/minesweeper.css">
    <link rel="stylesheet" href="assets/css/games/wordle.css">
    <link rel="stylesheet" href="assets/css/games/towerdefense.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕹️</text></svg>">
</head>
<body>
    <noscript><p style="padding:2rem;color:#fff">Nexus Arcade necesita JavaScript para funcionar.</p></noscript>

    <canvas id="bg-particles" aria-hidden="true"></canvas>

    <div id="app">
        <!-- Selección de perfil -->
        <div id="auth-screen" class="auth-screen" hidden></div>

        <!-- Aplicación -->
        <div id="shell" class="shell" hidden>
            <aside id="sidebar" class="sidebar" aria-label="Navegación principal">
                <div class="sidebar-header">
                    <a class="brand" href="#/home" aria-label="Nexus Arcade, ir al inicio">
                        <span class="logo-diamond">◆</span>
                        <span class="brand-text"><span class="logo-title">NEXUS</span><span class="logo-sub">ARCADE</span></span>
                    </a>
                    <button id="sidebar-collapse" class="icon-btn sidebar-collapse-btn" type="button"
                            aria-controls="sidebar" aria-expanded="true" aria-label="Plegar barra lateral"
                            title="Plegar / desplegar (Ctrl + B)">
                        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                </div>

                <nav class="sidebar-nav" id="sidebar-nav"></nav>

                <div class="sidebar-footer">
                    <a id="user-card" class="user-card" href="#/profile">
                        <span class="avatar avatar-md" id="user-avatar" aria-hidden="true">🎮</span>
                        <span class="user-info">
                            <span class="user-name" id="user-name">Jugador</span>
                            <span class="user-rank" id="user-rank">Nivel 1</span>
                            <span class="user-xp">
                                <span class="bar"><span class="bar-fill" id="user-xp-fill"></span></span>
                                <span class="user-xp-text" id="user-xp-text">0 / 100 XP</span>
                            </span>
                        </span>
                    </a>
                    <button id="btn-switch-user" class="icon-btn switch-user" type="button" title="Cambiar de usuario" aria-label="Cambiar de usuario">
                        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 4H5a1 1 0 00-1 1v14a1 1 0 001 1h4M16 8l4 4-4 4M20 12H9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        <span class="switch-user-label">Cambiar usuario</span>
                    </button>
                </div>
            </aside>

            <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

            <div class="main-wrap">
                <header class="topbar">
                    <button id="sidebar-toggle" class="icon-btn" type="button" aria-controls="sidebar" aria-expanded="true"
                            aria-label="Plegar barra lateral" title="Menú (Ctrl + B)">
                        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
                    </button>
                    <h1 id="page-title" class="page-heading">Inicio</h1>
                    <div class="topbar-right"><span id="topbar-level" class="chip">Nv. 1</span></div>
                </header>
                <main id="view" class="view-container" tabindex="-1"></main>
            </div>
        </div>
    </div>

    <!-- Núcleo -->
    <script src="src/core/namespace.js"></script>
    <script src="src/core/utils.js"></script>
    <script src="src/core/events.js"></script>
    <script src="src/core/storage.js"></script>
    <script src="src/core/hash.js"></script>
    <script src="src/core/schema.js"></script>
    <script src="src/core/audio.js"></script>

    <!-- Servicios -->
    <script src="src/services/settings.js"></script>
    <script src="src/services/users.js"></script>
    <script src="src/services/progress.js"></script>
    <script src="src/services/achievements.js"></script>
    <script src="src/services/leaderboard.js"></script>

    <!-- Interfaz -->
    <script src="src/ui/toast.js"></script>
    <script src="src/ui/modal.js"></script>
    <script src="src/ui/fx.js"></script>
    <script src="src/ui/particles.js"></script>
    <script src="src/ui/components.js"></script>
    <script src="src/ui/sidebar.js"></script>
    <script src="src/ui/router.js"></script>
    <script src="src/ui/auth.js"></script>
    <script src="src/ui/pages/home.js"></script>
    <script src="src/ui/pages/library.js"></script>
    <script src="src/ui/pages/achievements.js"></script>
    <script src="src/ui/pages/rankings.js"></script>
    <script src="src/ui/pages/stats.js"></script>
    <script src="src/ui/pages/profile.js"></script>
    <script src="src/ui/pages/settings.js"></script>

    <!-- Juegos -->
    <script src="assets/data/words-es.js"></script>
    <script src="src/games/registry.js"></script>
    <script src="src/games/minesweeper/game.js"></script>
    <script src="src/games/wordle/dictionary.js"></script>
    <script src="src/games/wordle/game.js"></script>
    <script src="src/games/towerdefense/data.js"></script>
    <script src="src/games/towerdefense/engine.js"></script>
    <script src="src/games/towerdefense/game.js"></script>

    <script src="src/app.js"></script>
</body>
</html>
