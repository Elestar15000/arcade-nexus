# Publica la web en GitHub Pages y (si está configurado) despliega el backend del ranking.
# Configuración única: ver backend/README.md ("Activación automática").
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read      # deploy-pages busca el artefacto «github-pages» con la API de Actions

# Las publicaciones se ponen en cola: cancelar un despliegue de Pages a medias deja la anterior «en curso» y el
# siguiente falla con «Deployment request failed … due to in progress deployment» (pasaba al hacer dos push seguidos)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  backend:
    name: Backend del ranking (Cloudflare Worker)
    runs-on: ubuntu-latest
    outputs:
      api_url: ${{ steps.deploy.outputs.api_url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      DATA_REPO: ${{ vars.DATA_REPO }}
      ADMIN_USERS: ${{ vars.ADMIN_USERS }}
      ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
    steps:
      - uses: actions/checkout@v6
      - name: Desplegar Worker
        id: deploy
        working-directory: backend
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$DATA_TOKEN" ] || [ -z "$SESSION_SECRET" ] || [ -z "$DATA_REPO" ]; then
            echo "::notice::Faltan secrets/variables del backend: la web se publica en modo local (sin ranking global)."
            echo "api_url=${{ vars.API_URL }}" >> "$GITHUB_OUTPUT"; exit 0
          fi
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          sed -i "s|^GITHUB_REPO = .*|GITHUB_REPO = \"${DATA_REPO}\"|" wrangler.toml
          sed -i "s|^ALLOWED_ORIGIN = .*|ALLOWED_ORIGIN = \"https://${OWNER,,}.github.io\"|" wrangler.toml
          sed -i "s|^ADMIN_USERS = .*|ADMIN_USERS = \"${ADMIN_USERS}\"|" wrangler.toml
          npx --yes wrangler@3 deploy 2>&1 | tee deploy.log
          printf '%s' "$DATA_TOKEN"     | npx wrangler@3 secret put GITHUB_TOKEN
          printf '%s' "$SESSION_SECRET" | npx wrangler@3 secret put SESSION_SECRET
          if [ -n "$ADMIN_KEY" ]; then printf '%s' "$ADMIN_KEY" | npx wrangler@3 secret put ADMIN_KEY; fi
          URL=$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' deploy.log | head -1)
          echo "api_url=${URL}" >> "$GITHUB_OUTPUT"

  build:
    name: Preparar la web
    needs: backend
    # La web se publica aunque falle el despliegue del Worker (antes, un fallo del backend dejaba la web sin actualizar)
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Preparar sitio
        env:
          API_URL: ${{ needs.backend.outputs.api_url || vars.API_URL }}
        run: |
          mkdir _site
          cp -r index.html config.js assets src _site/
          if [ -n "$API_URL" ]; then
            printf "window.NEXUS_CONFIG = { API_URL: '%s' };\n" "${API_URL%/}" > _site/config.js
          fi
          # Rompe la caché del navegador y del CDN (10 min): cada versión pide sus propios .js y .css
          sed -i -E "s#(src|href)=\"((assets|src)/[^\"?]+\.(js|css))\"#\1=\"\2?v=${GITHUB_SHA::8}\"#g" _site/index.html
          sed -i -E "s#src=\"config\.js\"#src=\"config.js?v=${GITHUB_SHA::8}\"#" _site/index.html
          touch _site/.nojekyll
          echo "config.js publicado:"; cat _site/config.js
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with: { path: _site, include-hidden-files: true }

  # Publicar en un job aparte: si se sube y se despliega en el mismo job, deploy-pages@v5 a veces busca el artefacto
  # antes de que GitHub lo tenga visible («No artifacts named "github-pages" were found»). Separados, el artefacto ya
  # existe al empezar este job y «Re-run failed jobs» reintenta sólo la publicación, sin subir un segundo artefacto.
  pages:
    name: Publicar en GitHub Pages
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
