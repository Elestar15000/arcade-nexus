# Publica la web en GitHub Pages y (si está configurado) despliega el backend del ranking.
# Configuración única: ver backend/README.md ("Activación automática").
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  backend:
    name: Backend del ranking (Cloudflare Worker)
    runs-on: ubuntu-latest
    outputs:
      api_url: ${{ steps.deploy.outputs.api_url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      DATA_REPO: ${{ vars.DATA_REPO }}
    steps:
      - uses: actions/checkout@v4
      - name: Desplegar Worker
        id: deploy
        working-directory: backend
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$DATA_TOKEN" ] || [ -z "$SESSION_SECRET" ] || [ -z "$DATA_REPO" ]; then
            echo "::notice::Faltan secrets/variables del backend: la web se publica en modo local (sin ranking global)."
            echo "api_url=${{ vars.API_URL }}" >> "$GITHUB_OUTPUT"; exit 0
          fi
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          sed -i "s|^GITHUB_REPO = .*|GITHUB_REPO = \"${DATA_REPO}\"|" wrangler.toml
          sed -i "s|^ALLOWED_ORIGIN = .*|ALLOWED_ORIGIN = \"https://${OWNER,,}.github.io\"|" wrangler.toml
          npx --yes wrangler@3 deploy 2>&1 | tee deploy.log
          printf '%s' "$DATA_TOKEN"     | npx wrangler@3 secret put GITHUB_TOKEN
          printf '%s' "$SESSION_SECRET" | npx wrangler@3 secret put SESSION_SECRET
          URL=$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' deploy.log | head -1)
          echo "api_url=${URL}" >> "$GITHUB_OUTPUT"

  pages:
    name: Publicar en GitHub Pages
    needs: backend
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar sitio
        env:
          API_URL: ${{ needs.backend.outputs.api_url }}
        run: |
          mkdir _site
          cp -r index.html config.js assets src _site/
          if [ -n "$API_URL" ]; then
            printf "window.NEXUS_CONFIG = { API_URL: '%s' };\n" "${API_URL%/}" > _site/config.js
          fi
          touch _site/.nojekyll
          echo "config.js publicado:"; cat _site/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
